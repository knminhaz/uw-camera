name: Build UW Camera APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Android package (preview installs separately)"
        required: true
        default: standard
        type: choice
        options:
          - standard
          - preview
      abi:
        description: "Native library architectures"
        required: true
        default: arm64-v8a
        type: choice
        options:
          - arm64-v8a
          - universal

permissions:
  contents: read

jobs:
  build:
    name: Debug APK (${{ inputs.variant }}, ${{ inputs.abi }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Gradle and cache
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install SDK platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Assemble installable debug APK
        shell: bash
        env:
          APP_VARIANT: ${{ inputs.variant }}
          APP_ABI: ${{ inputs.abi }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          args=("--no-daemon" "--stacktrace")
          if [[ "$APP_VARIANT" == "preview" ]]; then
            args+=("-PcameraPreview=true")
          fi
          if [[ "$APP_ABI" == "arm64-v8a" ]]; then
            args+=("-PcameraAbi=arm64-v8a")
          fi
          ./gradlew "${args[@]}" :app:assembleDebug

      - name: Verify APK and record checksum
        shell: bash
        env:
          APP_VARIANT: ${{ inputs.variant }}
          APP_ABI: ${{ inputs.abi }}
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          file "$apk"
          sha256sum "$apk" | tee APK-SHA256.txt
          {
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Commit: $GITHUB_SHA"
            echo "Variant: $APP_VARIANT"
            echo "ABI: $APP_ABI"
            echo "Build: debug (Android Gradle Plugin debug signing)"
          } | tee BUILD-INFO.txt

      - name: Upload downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: UW-Camera-${{ inputs.variant }}-${{ inputs.abi }}-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            APK-SHA256.txt
            BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
